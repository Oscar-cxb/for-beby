<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>for you</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6f1; --ink:#3b2a4a; --soft:#806a8e; --card:#ffffff; --line:#f0dfd8;
  --blush:#ffc4b0; --lav:#c9b8f0; --honey:#e3a93f;
  --night:#1b1938; --night2:#2f2a60;
  --hand:"Nanum Pen Script","Segoe Print","Comic Sans MS",cursive;
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16142d; --ink:#f4eeff; --soft:#b4a8d2; --card:#221f45; --line:#332e5f;
    --blush:#ffae98; --lav:#a996e6; --honey:#f2c46b;
  }
}
:root[data-theme="dark"]{
  --bg:#16142d; --ink:#f4eeff; --soft:#b4a8d2; --card:#221f45; --line:#332e5f;
  --blush:#ffae98; --lav:#a996e6; --honey:#f2c46b;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honey);outline-offset:3px;border-radius:8px}
.hand{font-family:var(--hand);font-weight:400;line-height:1.1}
[hidden]{display:none!important}

/* stars */
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}

/* gate */
#gate{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 100%,var(--night2),var(--night) 70%);color:#f4eeff;display:grid;place-items:center;padding:24px;transition:opacity .9s ease,filter .9s ease}
#gate.leaving{opacity:0;filter:brightness(2.2)}
.gate-box{position:relative;text-align:center;max-width:320px;width:100%}
.gate-box h1{font-size:52px;margin:0 0 6px}
.gate-box p{margin:0 0 22px;color:#cfc4ec}
.gate-box input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #5a5296;background:rgba(255,255,255,.08);color:#fff;font-size:18px;text-align:center}
.gate-box input::placeholder{color:#9f95c7}
.gate-box button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:#f2c46b;color:#2a2150;font-weight:700;font-size:17px;cursor:pointer}
.gate-box button:disabled{opacity:.6}
.gate-err{min-height:24px;margin-top:10px;color:#ffb3a0;font-size:15px}

/* layout */
main{max-width:520px;margin:0 auto;padding:0 20px 150px}
section{display:none}
section.on{display:block}
.pg-title{font-size:44px;margin:28px 0 4px}
.pg-sub{color:var(--soft);margin:0 0 22px}
.empty{text-align:center;color:var(--soft);padding:36px 12px;border:1.5px dashed var(--line);border-radius:20px}
.by{font-size:13px;color:var(--soft);font-weight:600}

/* home */
.sky{position:relative;margin:16px -20px 0;height:300px;overflow:hidden;border-radius:0 0 36px 36px}
.sky.day{background:linear-gradient(#ffd9c7,#ffeede 55%,var(--bg))}
.sky.night{background:linear-gradient(var(--night),var(--night2))}
.orb{position:absolute;right:34px;top:40px;width:64px;height:64px;border-radius:50%}
.sky.day .orb{background:#ffbf6b;box-shadow:0 0 60px 18px rgba(255,191,107,.55)}
.sky.night .orb{background:#fff4d6;box-shadow:0 0 40px 10px rgba(255,244,214,.3)}
.sky.night .orb::after{content:"";position:absolute;inset:-4px -4px 10px 14px;border-radius:50%;background:var(--night)}
.sky-text{position:absolute;left:24px;bottom:26px;right:24px}
.sky-text .hi{font-size:54px;margin:0}
.sky.night .sky-text{color:#f4eeff}
.sky.day .sky-text{color:#3b2a4a}
.sky-text small{font-size:15px;opacity:.8}
.count{margin:28px 0 4px;font-size:19px}
.count b{font-family:var(--hand);font-weight:400;font-size:58px;color:var(--honey);line-height:.9;display:block}
.linkish{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:15px}
.note{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:20px 22px;margin-top:22px}
.note .hand{font-size:27px;margin:0;white-space:pre-line}
.note .sign{text-align:right;margin-top:8px}
.logout{display:block;margin:40px auto 0}

/* us toggle */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px;margin:10px 0 18px}
.seg button{border:0;background:none;padding:10px;border-radius:999px;font-weight:700;color:var(--soft);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--blush);color:#3b2a4a}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;border-left:2px dashed var(--lav)}
.mem{position:relative;margin-bottom:34px}
.mem::before{content:"";position:absolute;left:-24px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--blush);border:3px solid var(--bg)}
.mem .date{font-size:14px;color:var(--soft);font-weight:600}
.polaroid{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:#fffdf9;padding:10px 10px 14px;border-radius:6px;box-shadow:0 8px 22px -10px rgba(59,42,74,.45);margin-top:8px;color:#3b2a4a}
.mem:nth-child(odd) .polaroid{transform:rotate(-1.4deg)}
.mem:nth-child(even) .polaroid{transform:rotate(1.2deg)}
.photo{aspect-ratio:4/3;border-radius:3px;background:linear-gradient(135deg,#ffd6c8,#dcd0f7);display:grid;place-items:center;font-size:40px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.polaroid .hand{font-size:28px;margin:10px 4px 0}
.polaroid p{margin:4px 4px 0;font-size:15px;color:#6b5878}
.polaroid .by{color:#8a7896;margin:6px 4px 0}

/* gallery */
.gal-title{font-size:34px;margin:0 0 14px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal button{border:0;padding:0;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--line)}
.gal button img{width:100%;height:100%;object-fit:cover}
#lb{position:fixed;inset:0;z-index:40;background:rgba(18,15,38,.96);color:#f4eeff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lb-img{width:100%;max-width:560px;flex:1;display:grid;place-items:center;min-height:0}
.lb-img img{max-height:68vh;width:auto;max-width:100%;border-radius:10px;object-fit:contain}
.lb-cap{font-size:30px;margin:14px 0 2px;text-align:center;min-height:30px}
.lb-by{font-size:13px;color:#b4a8d2;margin-bottom:8px}
.lb-nav{display:flex;align-items:center;gap:24px;font-size:15px;color:#b4a8d2}
.lb-nav button,.lb-x{background:rgba(255,255,255,.1);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:26px;cursor:pointer}
.lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;font-size:18px}
.lb-del{background:none;border:0;color:#ffb3a0;text-decoration:underline;cursor:pointer;font-size:14px;margin-top:10px}

/* constellation */
.cons{position:relative;margin:0 -20px;background:radial-gradient(90% 70% at 50% 40%,var(--night2),var(--night));border-radius:32px;overflow:hidden;aspect-ratio:3/4;max-height:70vh;width:calc(100% + 40px)}
.cons svg{position:absolute;inset:0;width:100%;height:100%}
.cons .path{fill:none;stroke:#cfc4ec;stroke-width:.35;stroke-dasharray:1.2 1.2;opacity:.8}
.star{cursor:pointer}
.star .glow{fill:#f2c46b;opacity:.25}
.star .core{fill:#fff4d6}
.star text{font-family:var(--hand);font-size:5px;fill:#f4eeff}
.star:focus{outline:none}
.star:focus-visible .glow{opacity:.7}
.star.seen .glow{fill:#ffae98}
.cons-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#b4a8d2;font-size:14px}

/* letters */
.letters{display:grid;gap:14px}
.env{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;cursor:pointer}
.env .flap{flex:none;width:52px;height:38px;border-radius:6px;background:var(--blush);position:relative;overflow:hidden}
.env .flap::before{content:"";position:absolute;left:0;right:0;top:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:20px solid rgba(255,255,255,.55)}
.env.opened .flap{background:var(--lav)}
.env .hand{font-size:28px}
.env small{display:block;color:var(--soft);font-size:14px}

/* sheet */
#veil{position:fixed;inset:0;background:rgba(20,16,40,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:14px 24px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
#sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 18px}
#sheet h2{font-family:var(--hand);font-weight:400;font-size:40px;margin:0 0 2px;line-height:1}
#sheet .meta{color:var(--soft);font-size:14px;margin-bottom:14px}
#sheet .body{font-family:var(--hand);font-size:27px;line-height:1.25;white-space:pre-line}
#sheet .photo{margin-bottom:16px;border-radius:14px;aspect-ratio:auto;max-height:50vh}
#sheet .photo img{max-height:50vh;object-fit:contain;background:#000}
.sheet-actions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:#d9534f;border-color:transparent;text-decoration:underline;font-weight:600}
.btn:disabled{opacity:.55}

/* forms */
.form label{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
.form label small{font-weight:400;color:var(--soft)}
.form input[type=text],.form input[type=date],.form textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.form textarea{min-height:130px;resize:vertical;font-family:var(--hand);font-size:24px;line-height:1.2}
.form input[type=file]{width:100%;font-size:15px}
.form .prefix{display:flex;align-items:center;gap:8px}
.form .prefix span{font-family:var(--hand);font-size:26px;white-space:nowrap}
.form-err{color:#d9534f;font-size:15px;min-height:22px;margin-top:10px}

/* add button */
#fab{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:13px 22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 10px 24px -10px rgba(20,16,40,.6);cursor:pointer;white-space:nowrap}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav .row{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--soft);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button span{font-size:22px;line-height:1.1}
nav button[aria-current="page"]{color:var(--ink)}


/* ============ note reactions ============ */
.note{position:relative;-webkit-touch-callout:none}
.reacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.r-pill{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px}
.r-add{background:none;border:1.5px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:14px;cursor:pointer;color:var(--soft)}
.r-bar{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 10px 24px -12px rgba(20,16,40,.5);margin-top:10px;width:max-content;max-width:100%}
.r-bar button{border:0;background:none;font-size:26px;line-height:1;padding:4px 5px;border-radius:50%;cursor:pointer;transition:transform .12s}
.r-bar button:active,.r-bar button:hover{transform:scale(1.25)}
.r-bar button.mine{background:var(--blush)}

/* ============ daily check-ins ============ */
.streak{display:inline-block;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;margin-bottom:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ci{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:left;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:120px}
.ci.none{cursor:default;border-style:dashed;background:transparent;justify-content:center;align-items:center;text-align:center;color:var(--soft);font-size:14px}
.ci-who{font-size:13px;font-weight:700;color:var(--soft)}
.ci-mood{font-size:34px;line-height:1}
.ci .hand{font-size:22px;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.ci img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-top:4px}
.day-h{font-weight:700;color:var(--soft);font-size:14px;margin:26px 0 8px}
.pair.small .ci{min-height:0}
.pair.small .ci-mood{font-size:26px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods label{margin:0}
.moods input{position:absolute;opacity:0;pointer-events:none}
.moods span{display:block;font-size:30px;padding:6px 9px;border-radius:14px;border:1.5px solid var(--line);cursor:pointer}
.moods input:checked + span{background:var(--blush);border-color:var(--blush)}
.moods input:focus-visible + span{outline:3px solid var(--honey)}

/* ============ wandering buddy ============ */
#buddy{position:fixed;left:0;top:0;width:54px;height:74px;z-index:15;cursor:pointer;will-change:transform;-webkit-user-select:none;user-select:none}
#buddy .b-in{width:100%;height:100%;transform-origin:50% 90%}
#buddy .b-in.walk{animation:waddle .55s ease-in-out infinite}
#buddy .b-in.hop{animation:hop .5s ease-out}
#buddy svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 4px rgba(40,30,60,.25));transition:transform .2s}
#buddy.left svg{transform:scaleX(-1)}
@keyframes waddle{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-8deg)}70%{transform:translateY(0) scaleY(.9)}100%{transform:none}}
.b-say{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:4px 10px;font-family:var(--hand);font-size:22px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.b-say.on{opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="gate">
  <div class="stars" id="gateStars"></div>
  <form class="gate-box" id="gateForm" autocomplete="off" hidden>
    <h1 class="hand">hi you.</h1>
    <p>What do I always call you?</p>
    <input id="gateInput" type="text" aria-label="Password" placeholder="type it here" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit" id="gateBtn">Come in</button>
    <div class="gate-err" id="gateErr" role="alert"></div>
  </form>
</div>

<main>
  <section id="home" class="on">
    <div class="sky" id="sky">
      <div class="stars" id="skyStars"></div>
      <div class="orb"></div>
      <div class="sky-text">
        <p class="hand hi" id="hello"></p>
        <small id="skyLine"></small>
      </div>
    </div>
    <p class="count" id="count"></p>
    <button class="linkish" id="setReunion">Set the day we see each other again</button>
    <div id="noteBox"></div>
    <button class="linkish logout" id="logout">Log out</button>
  </section>

  <section id="us">
    <h2 class="hand pg-title">us, so far</h2>
    <div class="seg" role="tablist">
      <button role="tab" data-view="story" aria-selected="true">Our story</button>
      <button role="tab" data-view="pics" aria-selected="false">All pics</button>
    </div>
    <div id="storyView">
      <p class="pg-sub">Oldest at the top. Scroll down.</p>
      <div class="tl" id="timeline"></div>
    </div>
    <div id="picsView" hidden>
      <p class="hand gal-title">captured memories with beby</p>
      <div class="gal" id="gallery"></div>
    </div>
  </section>

  <section id="daily">
    <h2 class="hand pg-title">daily check-in</h2>
    <p class="pg-sub">One little update a day, from both of us.</p>
    <div id="streak"></div>
    <div id="todayBox"></div>
    <div id="history"></div>
  </section>

  <section id="places">
    <h2 class="hand pg-title">our places</h2>
    <p class="pg-sub">Every star is somewhere we went. Tap one.</p>
    <div class="cons">
      <div class="stars" id="consStars"></div>
      <svg viewBox="0 0 100 133" id="consSvg" aria-label="Map of our places"></svg>
      <div class="cons-hint" id="consHint"></div>
    </div>
  </section>

  <section id="letters">
    <h2 class="hand pg-title">open when…</h2>
    <p class="pg-sub">Letters for each other. Open one when you need it.</p>
    <div class="letters" id="letterList"></div>
  </section>
</main>

<div id="buddy" hidden aria-label="Little buddy" role="button" tabindex="0">
  <div class="b-say" id="bSay"></div>
  <div class="b-in" id="bIn">
  <svg viewBox="0 0 60 82" aria-hidden="true">
    <!-- threads -->
    <g stroke="#e6dcc4" stroke-width="1" stroke-linecap="round">
      <path d="M22 72 l-2 8 M26 73 l-1 8 M31 73 l1 7 M36 72 l2 8"/>
    </g>
    <!-- floppy cloth body -->
    <path d="M17 46 C10 52 7 62 9 70 C16 75 44 75 51 70 C53 61 49 52 43 46 Z" fill="#e8dfca" stroke="#cbbfa5" stroke-width="1"/>
    <path d="M18 56 C24 60 34 60 42 55 M14 66 C22 69 38 69 47 65" fill="none" stroke="#d3c8ae" stroke-width="1.2" stroke-linecap="round"/>
    <!-- knit scarf -->
    <path d="M15 44 C20 40 40 40 45 44 C46 49 40 51 30 51 C20 51 14 49 15 44 Z" fill="#9ea6ab"/>
    <path d="M19 45 v3 M23 44 v4 M27 44 v4 M31 44 v4 M35 44 v4 M39 44 v4 M42 45 v3" stroke="#8a9398" stroke-width="1" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="30" cy="24" rx="19" ry="19" fill="#efe7d5" stroke="#d8ccb2" stroke-width="1"/>
    <path d="M14 20 C16 12 22 7 29 6" fill="none" stroke="#fff8ea" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <!-- drawn eyes -->
    <circle cx="22.5" cy="24" r="6" fill="none" stroke="#3e3f48" stroke-width="2.1"/>
    <circle cx="37.5" cy="24" r="6" fill="none" stroke="#3e3f48" stroke-width="2.1"/>
    <circle cx="22" cy="24.5" r="2.4" fill="#4a4b55"/>
    <circle cx="37" cy="24.5" r="2.4" fill="#4a4b55"/>
    <!-- little mouth -->
    <path d="M27 34 q3 2 6 0" fill="none" stroke="#4a4b55" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  </div>
</div>

<button id="fab" hidden></button>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo" hidden>
  <button class="lb-x" id="lbClose" aria-label="Close">✕</button>
  <div class="lb-img" id="lbImg"></div>
  <p class="hand lb-cap" id="lbCap"></p>
  <div class="lb-by" id="lbBy"></div>
  <div class="lb-nav">
    <button id="lbPrev" aria-label="Previous photo">‹</button>
    <span id="lbCount"></span>
    <button id="lbNext" aria-label="Next photo">›</button>
  </div>
  <button class="lb-del" id="lbDel" hidden>Delete this photo</button>
</div>

<div id="veil"></div>

/* ============ photo shrinking ============ */
function shrink(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      let max = 1400, q = .82, out = "";
      for(let tries=0; tries<8; tries++){
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if(out.length < 850000) break;
        q -= .08; max *= .85;
      }
      URL.revokeObjectURL(url);
      out.length < 1000000 ? resolve(out) : reject(new Error("too big"));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("unreadable")); };
    img.src = url;
  });
}

    async save(f){ return [{home:{ note:f.elements.note.value.trim(), noteBy:me.uid, noteByName:me.name, noteAt:serverTimestamp(), reactions:deleteField() }}]; } },
  checkin:{ title:"Today's check-in", html:()=>{ const c = myToday() || {}; return `
    <label>How are you feeling?</label>
    <div class="moods">${MOODS.map(m=>`<label><input type="radio" name="mood" value="${m}" ${c.mood===m?"checked":""}><span>${m}</span></label>`).join("")}</div>
    <label>How's your day? <small>(a line or two)</small></label><textarea name="text" maxlength="300">${esc(c.text||"")}</textarea>
    <label>Pic of your day <small>(optional${c.photo?", leave empty to keep the current one":""})</small></label><input type="file" name="photo" accept="image/*">`; },
    check(f){ return f.elements.mood.value ? "" : "Pick a mood first."; },
    async save(f){ const c = myToday() || {}; return [{coll:"checkins", id:`${me.uid}_${todayKey()}`, data:{ date:todayKey(), mood:f.elements.mood.value, text:f.elements.text.value.trim(), photo: f.elements.photo.files[0] ? await shrink(f.elements.photo.files[0]) : (c.photo||"") }}]; } },
  reunion:{ title:"When do we meet again?", html:`
    <label>Pick the date</label><input type="date" name="reunion" min="${today}" required>`,
    async save(f){ return [{home:{ reunion:f.elements.reunion.value }}]; } }
};

function freeSpot(){
  const pts = S.places || [];
  let best = {x:50,y:66}, bestD = -1;
  for(let i=0;i<60;i++){
    const x = Math.round(14 + Math.random()*72), y = Math.round(16 + Math.random()*100);
    const d = pts.length ? Math.min(...pts.map(p=>Math.hypot(p.x-x, p.y-y))) : 99;
    if(d > bestD){ best = {x,y}; bestD = d; }
    if(d > 22) break;
  }
  return best;
}

function openForm(kind){
  const F = FORMS[kind];
  openSheet(`<form class="form" id="addForm" novalidate>
    <h2>${F.title}</h2>${typeof F.html==="function" ? F.html() : F.html}
    <div class="form-err" id="formErr" role="alert"></div>
    <div class="sheet-actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" id="saveBtn">Save</button></div>
  </form>`);
  $("#addForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const f = e.target, btn = $("#saveBtn"), errEl = $("#formErr");
    const missing = [...f.querySelectorAll("[required]")].find(el => el.type==="file" ? !el.files.length : !el.value.trim());
    if(missing){ errEl.textContent = "Fill in the highlighted bit first."; missing.focus(); return; }
    const bad = F.check ? F.check(f) : ""; if(bad){ errEl.textContent = bad; return; }
    btn.disabled = true; btn.textContent = "Saving…"; errEl.textContent = "";
    try{
      const items = await F.save(f);
      for(const it of items){
        if(it.home) await setDoc(doc(db,"meta","home"), it.home, {merge:true});
        else if(it.id) await setDoc(doc(db, it.coll, it.id), { ...it.data, by:me.uid, byName:me.name, createdAt:serverTimestamp() });
        else await addDoc(collection(db, it.coll), { ...it.data, by:me.uid, byName:me.name, createdAt:serverTimestamp() });
      }
      closeSheet();
    }catch(err){
      console.error(err);
      errEl.textContent = err.message==="too big" || err.message==="unreadable"
        ? "That photo couldn't be used. Try a different one."
        : "Couldn't save. Check your internet and try again.";
      btn.disabled = false; btn.textContent = "Save";
    }
  });
}


/* ============ wandering buddy ============ */
const buddy = $("#buddy"), bIn = $("#bIn"), bSay = $("#bSay");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let bx = 24, by = 0, bTimer = null;
function bPlace(x, y, secs){
  buddy.style.transition = secs ? `transform ${secs}s linear` : "none";
  buddy.style.transform = `translate(${x}px, ${y}px)`;
}
function bLimits(){ return { minY: 70, maxX: Math.max(10, innerWidth - 64), maxY: Math.max(90, innerHeight - 200) }; }
function bWander(){
  clearTimeout(bTimer);
  const L = bLimits();
  const nx = 8 + Math.random() * (L.maxX - 8), ny = L.minY + Math.random() * (L.maxY - L.minY);
  const secs = Math.max(1.2, Math.hypot(nx - bx, ny - by) / 38);
  buddy.classList.toggle("left", nx < bx);
  bIn.classList.add("walk");
  bPlace(nx, ny, secs); bx = nx; by = ny;
  bTimer = setTimeout(()=>{ bIn.classList.remove("walk"); bTimer = setTimeout(bWander, 1500 + Math.random()*3500); }, secs*1000);
}
function bStart(){
  buddy.hidden = false;
  by = bLimits().maxY; bPlace(bx, by, 0);
  if(!still) bTimer = setTimeout(bWander, 1200);
}
const lines = ["💛", "hi!", "miss you", "boop", "hehe", "come back soon"];
function bPoke(){
  bIn.classList.remove("walk","hop"); void bIn.offsetWidth; bIn.classList.add("hop");
  bSay.textContent = lines[Math.floor(Math.random()*lines.length)];
  bSay.classList.add("on");
  const L = bLimits();
  const cur = new DOMMatrixReadOnly(getComputedStyle(buddy).transform);
  bx = Math.min(L.maxX, Math.max(8, cur.m41 || bx)); by = cur.m42 || by;
  clearTimeout(bTimer); bPlace(bx, by, 0);
  setTimeout(()=>{ bSay.classList.remove("on"); bIn.classList.remove("hop"); if(!still) bTimer = setTimeout(bWander, 1200); }, 1400);
}
buddy.addEventListener("click", bPoke);
buddy.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); bPoke(); }});
addEventListener("resize", ()=>{ const L = bLimits(); bx = Math.min(bx, L.maxX); by = Math.min(Math.max(by, L.minY), L.maxY); bPlace(bx, by, 0); });

/* ============ add button + tabs ============ */
let tab = "home";
function updateFab(){
  const map = { home:["note","✏️ Leave a note"], us: usView==="story" ? ["memory","+ Add memory"] : ["pics","+ Add pics"], places:["place","+ Add a place"], letters:["letter","💌 Write a letter"],
    daily: ["checkin", me && myToday() ? "✏️ Edit today's check-in" : "☀️ Check in today"] };
  const [kind, label] = map[tab];
  $("#fab").textContent = label; $("#fab").dataset.kind = kind;
}
$("#fab").addEventListener("click", ()=> openForm($("#fab").dataset.kind));
$("#setReunion").addEventListener("click", ()=> openForm("reunion"));

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click", ()=>{
  tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.removeAttribute("aria-current"));
  b.setAttribute("aria-current","page");
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on", s.id===tab));
  updateFab(); window.scrollTo(0,0);
}));
updateFab();
